<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Life Admin</title>
<style>
:root {
  --bg: #f4f4f1;
  --card: #ffffff;
  --ink: #1b1b1a;
  --muted: #74746f;
  --line: #e4e4de;
  --soft: #ececE6;
  --accent: #2f6f5e;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe5;
  --warn: #b5651d;
  --warn-soft: #f6e7d6;
  --bad: #b23a3a;
  --bad-soft: #f5dede;
  --good: #2f6f5e;
  --radius: 14px;
  --tabh: 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --card: #1d1d1c;
    --ink: #ededea;
    --muted: #9a9a94;
    --line: #2d2d2b;
    --soft: #262625;
    --accent: #6cc2a6;
    --accent-ink: #0f1a16;
    --accent-soft: #1f3530;
    --warn: #e2a463;
    --warn-soft: #3a2b1c;
    --bad: #ec7d7d;
    --bad-soft: #3d2222;
    --good: #6cc2a6;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(var(--tabh) + env(safe-area-inset-bottom) + 12px);
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
main { max-width: 560px; margin: 0 auto; padding: 8px 16px 24px; }

header.top { display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 0 10px; }
header.top h1 { font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
header.top .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.iconbtn { background: var(--card); border: 1px solid var(--line); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.iconbtn svg { width: 20px; height: 20px; }

.card { background: var(--card); border-radius: var(--radius); padding: 14px; margin: 12px 0; border: 1px solid var(--line); }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.card h2 a, .card h2 button.link { text-transform: none; letter-spacing: 0; font-size: 14px; }
.big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--soft); border-radius: 10px; padding: 10px; }
.stat .v { font-size: 20px; font-weight: 700; }
.stat .l { font-size: 12px; color: var(--muted); }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); min-height: 48px; }
.list li:first-child { border-top: 0; }
.list li.tap { cursor: pointer; }
.list .t { font-weight: 500; }
.list .s { font-size: 13px; color: var(--muted); }
.amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.group-h { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 2px; }

.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.good { background: var(--accent-soft); color: var(--good); }
button.pill { border: 0; min-height: 30px; padding: 4px 12px; }

.btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 12px; padding: 12px 16px; min-height: 46px; }
.btn.sec { background: var(--soft); color: var(--ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.sm { padding: 6px 12px; min-height: 34px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 4px 0; }

.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 0 12px; }
.quick button { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 62px; }
.quick button span.ic { font-size: 20px; line-height: 1; }

.seg { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; margin: 4px 0 8px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.bar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.catrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin: 10px 0; }
.catrow .bar { grid-column: 1 / -1; }

.chart { display: flex; align-items: flex-end; gap: 6px; height: 110px; padding-top: 6px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.chart .col i { display: block; width: 100%; background: var(--accent); border-radius: 5px 5px 2px 2px; min-height: 2px; }
.chart .col.cur i { background: var(--warn); }
.chart .col span { font-size: 10px; color: var(--muted); }
.chart .col b { font-size: 10px; font-weight: 600; color: var(--muted); }

.addbar { display: flex; gap: 8px; margin: 4px 0 8px; }
.addbar input, .addbar select { min-width: 0; }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; font-size: 16px;
}
input[type=date] { -webkit-appearance: none; appearance: none; }
textarea { min-height: 70px; resize: vertical; }
label.f { display: block; margin: 0 0 12px; }
label.f > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.chk { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 15px; }
.chk input { width: 22px; height: 22px; accent-color: var(--accent); }

.check { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check svg { width: 14px; height: 14px; }
li.done .t { text-decoration: line-through; color: var(--muted); }

.feel { display: flex; gap: 6px; }
.feel label { flex: 1; }
.feel input { display: none; }
.feel span { display: block; text-align: center; font-size: 24px; padding: 6px 0; border-radius: 10px; background: var(--soft); border: 2px solid transparent; }
.feel input:checked + span { border-color: var(--accent); background: var(--accent-soft); }

.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
nav.tabs button { flex: 1; border: 0; background: none; height: var(--tabh); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--accent); }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 18px 18px 0 0; max-height: 92vh; overflow-y: auto; transform: translateY(105%); transition: transform .25s ease; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; -webkit-overflow-scrolling: touch; }
.sheet.on { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
.sheet h3 { margin: 0 0 14px; font-size: 20px; }
.sheet .actions { display: flex; gap: 8px; margin-top: 6px; }
.sheet .actions .btn { flex: 1; }

.seg.sm button { padding: 6px 4px; font-size: 13px; }
.wk { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.wk:first-of-type { border-top: 0; padding-top: 2px; }
.wk .ic { font-size: 20px; width: 26px; text-align: center; flex: none; }
.key { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--good); font-weight: 700; display: grid; place-items: center; font-size: 14px; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.thesis { font-size: 15px; line-height: 1.5; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 12px; }
.radios { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.radios input { display: none; }
.radios span { display: inline-block; padding: 7px 12px; border-radius: 999px; background: var(--soft); font-size: 14px; font-weight: 600; color: var(--muted); }
.radios input:checked + span { background: var(--accent); color: var(--accent-ink); }
.stage { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.stage .grow { font-size: 15px; }
a.btn { display: block; text-align: center; text-decoration: none; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 14px); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; transition: all .2s; z-index: 30; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" id="tabs">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10h.01M18 15h.01"/></svg>Money</button>
  <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg>Food</button>
  <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg>Study</button>
  <button data-tab="life"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>Life</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

// ---------- storage ----------
const KEY = 'lifeadmin.v1';
const AISLES = ['Produce', 'Meat & Fish', 'Dairy & Eggs', 'Bakery', 'Pantry', 'Frozen', 'Snacks & Drinks', 'Household', 'Personal care', 'Other'];
const DEFAULTS = () => ({
  v: 1,
  settings: {
    name: '',
    unit: 'mi',
    currency: '$',
    categories: ['Groceries', 'Dining out', 'Transport', 'Shopping', 'Bills', 'Subscriptions', 'Fun', 'Health', 'Other'],
    body: { height: 183, age: 27, sex: 'male', activity: 1.5, surplus: 250, protein: 1.8 },
  },
  expenses: [],
  bills: [],
  grocery: [],
  pantry: [],
  runs: [],
  tasks: [],
  chores: [],
  shifts: [],
  pieces: [],
  ideas: [],
  study: { read: {}, bg: {}, chair: {} },
  course: null,
  cstate: { done: {}, offset: 0, asg: {}, have: {} },
  cal: {},
  gym: { templates: null, sessions: [], active: null, other: [] },
  food: { log: [], saved: [], kcal: 0, p: 0 },
  body: { weights: null },
  focus: {},
});

function merge(d) {
  const base = DEFAULTS();
  return { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) }, study: { ...base.study, ...(d.study || {}) }, cstate: { ...base.cstate, ...(d.cstate || {}) } };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return DEFAULTS();
    const d = JSON.parse(raw);
    return merge(d);
  } catch (e) {
    return DEFAULTS();
  }
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save. Export a backup!'); }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 86400000); // a - b
function addMonths(s, n, anchor) {
  const d = parse(s);
  const day = anchor || d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(day, last));
  return iso(t);
}
const money = n => {
  const neg = n < 0; n = Math.abs(n);
  const s = n.toLocaleString(undefined, { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return (neg ? '-' : '') + S.settings.currency + s;
};
const money2 = n => S.settings.currency + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const monthKey = s => s.slice(0, 7);
const monthName = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); };
const fmtDate = s => {
  const n = diffDays(s, today());
  if (n === 0) return 'Today';
  if (n === -1) return 'Yesterday';
  if (n === 1) return 'Tomorrow';
  const d = parse(s);
  const opts = { weekday: Math.abs(n) < 7 ? 'short' : undefined, month: 'short', day: 'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString(undefined, opts);
};
function dueLabel(s) {
  const n = diffDays(s, today());
  if (n < 0) return { t: n === -1 ? '1 day overdue' : `${-n} days overdue`, c: 'bad' };
  if (n === 0) return { t: 'Due today', c: 'warn' };
  if (n === 1) return { t: 'Tomorrow', c: 'warn' };
  if (n <= 7) return { t: `In ${n} days`, c: '' };
  return { t: fmtDate(s), c: '' };
}
const fmtDur = secs => {
  secs = Math.round(secs);
  const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
};
const fmtPace = (secs, dist) => dist > 0 ? `${fmtDur(secs / dist)}/${S.settings.unit}` : '—';
const fmtDist = d => `${(Math.round(d * 100) / 100).toLocaleString()} ${S.settings.unit}`;
function weekStart(s) { const d = parse(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return iso(d); } // Monday
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const FEELS = ['😫', '😕', '😐', '🙂', '😄'];

// ---------- calendar export (.ics) ----------
// ev: { key, title, date, start?, end?, allDay?, location?, notes?, alarms: ['-PT1H', ...], rrule? }
function icsText(events) {
  const escTxt = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const d8 = s => s.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const fold = l => { const out = []; while (l.length > 74) { out.push(l.slice(0, 74)); l = ' ' + l.slice(74); } out.push(l); return out.join('\r\n'); };
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Life Admin//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  for (const e of events) {
    lines.push('BEGIN:VEVENT', `UID:${e.key.replace(/[^A-Za-z0-9-]/g, '-')}@life-admin`, `DTSTAMP:${stamp}`);
    if (e.allDay) lines.push(`DTSTART;VALUE=DATE:${d8(e.date)}`, `DTEND;VALUE=DATE:${d8(addDays(e.date, 1))}`);
    else {
      const endDate = toMin(e.end) <= toMin(e.start) ? addDays(e.date, 1) : e.date;
      const hm = t => t.slice(0, 5).replace(':', '');
      lines.push(`DTSTART:${d8(e.date)}T${hm(e.start)}00`, `DTEND:${d8(endDate)}T${hm(e.end)}00`);
    }
    lines.push(`SUMMARY:${escTxt(e.title)}`);
    if (e.location) lines.push(`LOCATION:${escTxt(e.location)}`);
    if (e.notes) lines.push(`DESCRIPTION:${escTxt(e.notes)}`);
    if (e.rrule) lines.push(`RRULE:${e.rrule}`);
    for (const a of e.alarms || []) lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${escTxt(e.title)}`, `TRIGGER:${a}`, 'END:VALARM');
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.map(fold).join('\r\n') + '\r\n';
}
function addToCalendar(events, label) {
  if (!events.length) { toast('Nothing new to add'); return; }
  const ics = icsText(events);
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    // iOS only offers "Add to Calendar" for a real text/calendar response, so the
    // service worker serves cal.ics from the events packed into the URL.
    if (!navigator.serviceWorker || !navigator.serviceWorker.controller) { toast('Close and reopen the app once (while online), then try again'); return; }
    const bytes = new TextEncoder().encode(ics);
    let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    location.assign(`cal.ics?d=${btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`);
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    a.download = `${label.replace(/[^A-Za-z0-9 -]/g, '').trim() || 'events'}.ics`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  events.forEach(e => S.cal[e.key] = today());
  save(); render();
  toast(`${events.length} event${events.length === 1 ? '' : 's'} sent to Calendar`);
}
const shiftEvent = s => ({ key: `shift-${s.id}-${s.date}-${s.start}-${s.end}`, title: '☕ Café shift', date: s.date, start: s.start, end: s.end, notes: s.note, alarms: ['-PT1H'] });
const sessionEvent = s => ({ key: `plotinus-${s.date}`, title: `📜 Plotinus: ${s.label}${S.study.chair[s.date] ? ' (chairing)' : ''}`, date: s.date, start: '11:00', end: '13:00',

  : { key: `task-${x.id}-${x.due}`, title: `✅ ${x.title}`, date: x.due, allDay: true, notes: x.notes, alarms: ['PT9H'] };
const BILL_RRULE = { weekly: 'FREQ=WEEKLY', biweekly: 'FREQ=WEEKLY;INTERVAL=2', monthly: 'FREQ=MONTHLY', quarterly: 'FREQ=MONTHLY;INTERVAL=3', yearly: 'FREQ=YEARLY' };
const billEvent = b => ({ key: `bill-${b.id}-${b.amount}-${b.freq}`, title: `💸 ${b.name} ${money2(b.amount)}${b.autopay ? ' (autopay)' : ''}`, date: b.next, allDay: true, rrule: BILL_RRULE[b.freq] || BILL_RRULE.monthly, alarms: ['-PT15H'] });
// Only the events not yet sent; once everything has been sent, offer all of them again.
function newOrAll(evs) { const fresh = evs.filter(e => !S.cal[e.key]); return fresh.length ? { fresh: true, list: fresh } : { fresh: false, list: evs }; }
const openAsgEvents = () => C().assignments.filter(a => asgStatus(a) !== 'assessed').map(asgEvent);
const calBtn = (action, label, extra = '') => `<button type="button" class="btn sec block" data-a="${action}" ${extra} style="margin:4px 0 8px">📅 ${label}</button>`;

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}

// ---------- bills logic ----------
function nextDue(b) {
  if (b.freq === 'weekly') return addDays(b.next, 7);
  if (b.freq === 'biweekly') return addDays(b.next, 14);
  if (b.freq === 'quarterly') return addMonths(b.next, 3, b.anchor);
  if (b.freq === 'yearly') return addMonths(b.next, 12, b.anchor);
  return addMonths(b.next, 1, b.anchor);
}
const perMonth = b => ({ weekly: 52 / 12, biweekly: 26 / 12, monthly: 1, quarterly: 1 / 3, yearly: 1 / 12 }[b.freq] || 1) * b.amount;
function payBill(b, silent) {
  S.expenses.push({ id: uid(), date: b.next <= today() ? b.next : today(), amount: b.amount, cat: b.kind === 'sub' ? 'Subscriptions' : 'Bills', note: b.name, bill: b.id });
  b.next = nextDue(b);
  if (!silent) toast(`${b.name} paid · next ${fmtDate(b.next)}`);
}
function runAutopay() {
  let n = 0;
  for (const b of S.bills) {
    let guard = 0;
    while (b.autopay && b.next <= today() && guard++ < 24) { payBill(b, true); n++; }
  }
  if (n) save();
}

function go(tab, segKey, segVal) {

function weekCard() {
  const rows = [focusTodayRow(), fitnessTodayRows()];

  if (sh) {
    const wkHours = shiftsInWeek(weekStart(today())).reduce((a, s) => a + shiftHours(s), 0);
    rows.push(`<div class="wk tap" data-a="goto" data-v="life" data-s="shifts"><div class="ic">☕</div><div class="grow"><div class="t">Next shift: ${fmtDate(sh.date)} · ${sh.start}–${sh.end}</div>

  }
  const ses = nextSession();
  if (ses) {

    rows.push(`<div class="wk"><div class="ic">📜</div><div class="grow tap" data-a="goto" data-v="study" data-s="plotinus"><div class="t">Plotinus ${fmtDate(ses.date).toLowerCase() === 'today' ? 'today' : fmtDate(ses.date)}: ${ses.label}</div>

  }
  rows.push(courseTodayRow());
  const pieces = S.pieces.filter(p => curStage(p));
  if (pieces.length) {

    rows.push(`<div class="wk tap" data-a="goto" data-v="life" data-s="piano"><div class="ic">🎹</div><div class="grow"><div class="t">${esc(p.title)}: ${st.name.toLowerCase()}</div>

  const rules = [

    ['Dairy & Eggs', /milk|egg|cheese|yogurt|yoghurt|butter|cream/],

  for (const [a, re] of rules) if (re.test(n)) return a;

// Running lives inside the Gym section as one card.
function runsCard() {
  const t = today();
  const runs = [...S.runs].sort((a, b) => b.date.localeCompare(a.date));
  const ws = weekStart(t);
  const sum = arr => arr.reduce((a, r) => a + r.dist, 0);
  const wk = runs.filter(r => r.date >= ws);
  const mo = runs.filter(r => monthKey(r.date) === monthKey(t));
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const s = addDays(ws, -7 * i), e = addDays(s, 6);
    weeks.push({ s, d: sum(runs.filter(r => r.date >= s && r.date <= e)), cur: i === 0 });
  }
  const max = Math.max(...weeks.map(w => w.d), 1);
  const longest = runs.reduce((a, r) => !a || r.dist > a.dist ? r : a, null);
  const fastest = runs.filter(r => r.dist >= 1).reduce((a, r) => !a || r.secs / r.dist < a.secs / a.dist ? r : a, null);
  const li = r => `<li class="tap" data-a="editRun" data-id="${r.id}"><div style="font-size:22px">${r.feel ? FEELS[r.feel - 1] : '🏃'}</div>

  if (!runs.length) return '';
  return `<section class="card"><h2>Running <button class="link small" data-a="addRun">+ Run</button></h2>
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="stat"><div class="v">${fmtDist(sum(wk))}</div><div class="l">this week · ${wk.length} run${wk.length === 1 ? '' : 's'}</div></div>
      <div class="stat"><div class="v">${fmtDist(sum(mo))}</div><div class="l">this month</div></div>

      <div class="col ${w.cur ? 'cur' : ''}"><b>${w.d ? Math.round(w.d * 10) / 10 : ''}</b><i style="height:${w.d / max * 75}%"></i><span>${parse(w.s).toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' })}</span></div>`).join('')}
    </div>
    <div class="small muted" style="margin:10px 0 4px">Longest: ${fmtDist(longest.dist)} (${fmtDate(longest.date)})${fastest ? ` · Fastest pace: ${fmtPace(fastest.secs, fastest.dist)}` : ''}</div>
    <ul class="list">${runs.slice(0, 4).map(li).join('')}</ul>

// shifts
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function shiftHours(s) { let d = toMin(s.end) - toMin(s.start); if (d <= 0) d += 1440; return d / 60; }
const fmtHours = h => `${Math.round(h * 10) / 10} hr${h === 1 ? '' : 's'}`;
function shiftEnded(s) { const t = today(); if (s.date !== t) return s.date < t; const n = new Date(); return n.getHours() * 60 + n.getMinutes() >= toMin(s.end) && toMin(s.end) > toMin(s.start); }
const upcomingShifts = () => S.shifts.filter(s => !shiftEnded(s)).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
const shiftsInWeek = ws => S.shifts.filter(s => s.date >= ws && s.date <= addDays(ws, 6));
function clashText(s) {
  const ses = PLOTINUS.sessions.find(x => x.date === s.date);
  const overlap = (a1, a2, b1, b2) => a1 < b2 && b1 < a2;
  const end = toMin(s.end) <= toMin(s.start) ? toMin(s.end) + 1440 : toMin(s.end);
  if (ses && overlap(toMin(s.start), end, 660, 780)) return 'Clashes with Plotinus';
  const other = S.shifts.find(o => o !== s && o.date === s.date && overlap(toMin(s.start), end, toMin(o.start), toMin(o.end) <= toMin(o.start) ? toMin(o.end) + 1440 : toMin(o.end)));
  return other ? 'Overlaps another shift' : '';
}

// Turn a text like "Tue 12-5, Sat 9-3" or "Thursday 17:00-23:00" into shifts.
const DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
function parseShifts(text) {
  const out = [];
  const t0 = today();
  const segs = text.split(/\n|;|,(?!\d)|\band\b|\s\/\s/i);
  let lastDate = null;
  for (const raw of segs) {
    const sgm = raw.toLowerCase();
    let date = null;
    let m = sgm.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s*(?:of\s*)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/) || null;
    if (m) date = pickYear(Number(m[1]), MONTHS.indexOf(m[2]));
    if (!date && (m = sgm.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*(\d{1,2})\b/))) date = pickYear(Number(m[2]), MONTHS.indexOf(m[1]));
    if (!date && (m = sgm.match(/\b(\d{1,2})[\/.](\d{1,2})\b(?!\s*(?:am|pm|:))/))) date = pickYear(Number(m[1]), Number(m[2]) - 1);
    if (!date && (m = sgm.match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/))) {
      const want = DAYS.indexOf(m[1]); const d = parse(t0); let n = (want - d.getDay() + 7) % 7;
      date = addDays(t0, n);
    }
    if (!date && /\b(today|tonight)\b/.test(sgm)) date = t0;
    if (!date && /\btomorrow\b/.test(sgm)) date = addDays(t0, 1);
    const tm = sgm.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?\s*(?:-|–|—|to|till|until)\s*(\d{1,2}|close)(?:[:.](\d{2}))?\s*(am|pm)?/);
    if (!date && tm && lastDate) date = lastDate;
    if (!date || !tm) continue;
    lastDate = date;
    let sh = Number(tm[1]), sm = Number(tm[2] || 0);
    let eh = tm[4] === 'close' ? null : Number(tm[4]), em = Number(tm[5] || 0);
    const sap = tm[3] || (tm[6] && !tm[3] && eh !== null && Number(tm[1]) < eh ? tm[6] : null);
    if (sap === 'pm' && sh < 12) sh += 12; else if (sap === 'am' && sh === 12) sh = 0;
    else if (!sap && sh < 7) sh += 12;
    if (eh === null) { eh = Math.min(sh + 6, 23); em = 0; }
    else if (tm[6] === 'pm' && eh < 12) eh += 12;
    else if (!tm[6] && eh * 60 + em <= sh * 60 + sm && eh < 12) eh += 12;
    const hhmm = (h, mi) => `${pad(h % 24)}:${pad(mi)}`;
    out.push({ date, start: hhmm(sh, sm), end: hhmm(eh, em) });
  }
  return out.filter((s, i) => out.findIndex(o => o.date === s.date && o.start === s.start) === i);
}
function pickYear(day, month) {
  if (month < 0 || month > 11 || day < 1 || day > 31) return null;
  const now = new Date(); let y = now.getFullYear();
  let d = new Date(y, month, day);
  if (diffDays(iso(d), today()) < -60) d = new Date(y + 1, month, day);
  return iso(d);
}

// piano
const STAGES = [['Learn notes, section by section', 0.4], ['Hands together', 0.25], ['Up to tempo', 0.2], ['Memorised & polished', 0.15]];
function planStages(from, to, names) {
  const span = Math.max(diffDays(to, from), names.length);
  const total = names.reduce((a, n) => a + STAGES.find(s => s[0] === n)[1], 0);
  let acc = 0;
  return names.map((n, i) => { acc += STAGES.find(s => s[0] === n)[1]; return { name: n, due: i === names.length - 1 ? to : addDays(from, Math.round(span * acc / total)), done: false }; });
}
const curStage = p => p.stages.find(s => !s.done);
const lastPractice = p => p.log.length ? p.log.reduce((a, l) => l.date > a ? l.date : a, '') : null;
function pieceFlags(p) {
  const st = curStage(p); const f = [];
  if (!st) return f;
  if (st.due < today()) f.push({ t: 'Behind', c: 'bad' });
  const lp = lastPractice(p) || p.start;
  const gap = diffDays(today(), lp);
  if (gap >= 7) f.push({ t: lastPractice(p) ? `No practice in ${gap} days` : 'Not started', c: 'warn' });
  return f;
}
const pieceUrgency = p => { const st = curStage(p); return st ? -diffDays(st.due, today()) + (pieceFlags(p).length * 5) : -999; };
function viewPiano() {
  const active = S.pieces.filter(p => curStage(p)).sort((a, b) => pieceUrgency(b) - pieceUrgency(a));
  const learned = S.pieces.filter(p => !curStage(p));

  const card = p => {

    return `<li class="tap" data-a="editPiece" data-id="${p.id}" style="flex-direction:column;align-items:stretch;gap:6px">
      <div class="row"><div class="grow"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.composer || '')}${p.composer ? ' · ' : ''}target ${fmtDate(p.target)}</div></div>
      <button class="btn sm sec" data-a="logPractice" data-id="${p.id}">Practised</button></div>
      ${st ? `<div class="small">Now: <b>${st.name}</b> · ${dueLabel(st.due).t.replace('Due today', 'due today').toLowerCase()}</div>` : ''}
      <div class="bar"><i style="width:${done / p.stages.length * 100}%"></i></div>
      <div class="row small muted" style="gap:6px;flex-wrap:wrap">${lp ? `Last practised ${fmtDate(lp).toLowerCase()}` : 'No practice logged yet'} ${pieceFlags(p).map(f => `<span class="pill ${f.c}">${f.t}</span>`).join('')}</div></li>`;
  };
  return `

const studyLink = i => /plotinus|neoplaton|proclus|emanation|kabbal|zohar|avicenna|ghazali|mystic|esoteric|hermetic|dionysius|eckhart|occasionalism/i.test(i.title + ' ' + (i.thesis || ''));
function ideaLi(i) {
  const st = IDEA_STATUS.find(s => s[0] === i.status);
  return `<li class="tap" data-a="openIdea" data-id="${esc(i.key)}"><div class="key">${esc(i.label || '•')}</div>
    <div class="grow"><div class="t clamp2">${esc(i.title)}</div><div class="s ellipsis">${esc(i.cluster || i.source || '')}</div></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${st && i.status !== 'seed' ? `<span class="pill ${i.status === 'drafting' ? 'warn' : i.status === 'written' ? 'good' : ''}">${st[1]}</span>` : ''}${studyLink(i) ? '<span class="pill good">study</span>' : ''}</div></li>`;
}
function viewIdeas() {
  const order = ['drafting', 'developing', 'seed', 'written', 'shelved'];
  const head = `<div class="row" style="margin:4px 0 8px"><label class="btn sec grow" style="text-align:center;display:grid;place-items:center">Import from Files<input type="file" data-a="importIdeas" hidden></label></div>`;
  if (!S.ideas.length) return head + `<section class="card"><div class="empty" style="text-align:left">
    <b>How to bring in your essay ideas</b><br><br>
    1. On your Mac, double-click <b>Sync Obsidian</b> in Desktop › programs. It reads your vaults and saves <b>life-admin-sync.json</b> to iCloud Drive › Life Admin.<br><br>
    2. Tap <b>Import from Files</b> above and choose that file.<br><br>
    Re-run it any time. Your statuses and notes here are kept. To add a new idea later, tag any Obsidian note <b>#essay-idea</b>.</div></section>`;
  const groups = order.map(st => [st, S.ideas.filter(i => i.status === st)]).filter(g => g[1].length);
  return head + `<p class="small muted" style="margin:0 0 4px">${S.ideas.length} ideas${S.study.ideasAt ? ` · synced ${fmtDate(S.study.ideasAt.slice(0, 10)).toLowerCase()}` : ''}. Tap one to set its status or add notes.</p>
  <section class="card">${groups.map(([st, arr]) => `<div class="group-h">${IDEA_STATUS.find(s => s[0] === st)[1]}</div><ul class="list">${arr.map(ideaLi).join('')}</ul>`).join('')}</section>`;
}
function ideaForm(i) {
  const link = S.study.vault && i.note ? `obsidian://open?vault=${encodeURIComponent(S.study.vault)}&file=${encodeURIComponent(i.note.replace(/\.md$/, ''))}` : '';
  openSheet(esc(i.title), `
    <div class="small muted" style="margin:-8px 0 10px">${esc(i.cluster || '')}${i.vaultStatus ? ' · ' + esc(i.vaultStatus) : ''}</div>
    ${i.thesis ? `<div class="thesis">${esc(i.thesis)}</div>` : ''}
    ${studyLink(i) ? '<p class="small" style="color:var(--good);margin:0 0 12px">Connects to your Plotinus / medieval mysticism study.</p>' : ''}
    <label class="f"><span>Status</span></label>
    <div class="radios" style="margin-top:-8px">${IDEA_STATUS.map(([v, l]) => `<label><input type="radio" name="status" value="${v}" ${i.status === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
    <label class="f"><span>My notes</span><textarea name="mine" placeholder="Next step, sources to find, where this could go…">${esc(i.mine || '')}</textarea></label>
    ${link ? `<a class="btn sec" href="${link}" style="margin-bottom:12px">Open note in Obsidian ↗</a>` : ''}`,
    f => { i.status = f.status || 'seed'; i.mine = f.mine.trim(); });
}
function importIdeas(d) {
  if (!d || !['life-admin-essay-ideas', 'life-admin-sync'].includes(d.kind) || !Array.isArray(d.ideas)) throw new Error('bad');
  let courseMsg = '';
  if (d.course) { S.course = d.course; S.study.syncAt = d.generated; courseMsg = ` · course: ${d.course.weeks.length} weeks`; }
  let added = 0, updated = 0;
  for (const n of d.ideas) {
    const old = S.ideas.find(x => x.key === n.key);
    if (old) { Object.assign(old, { ...n, status: old.status, mine: old.mine }); updated++; }
    else { S.ideas.push({ ...n, status: 'seed', mine: '' }); added++; }
  }
  S.study.vault = d.vault; S.study.ideasAt = d.generated;
  return `Imported ${added + updated} essay ideas${courseMsg}`;
}

const exT = (name, sets, lo, hi, inc) => ({ name, sets, lo, hi, inc });
const BEGINNER = () => [
  { id: 'A', name: 'Workout A', exercises: [exT('Back squat', 3, 6, 8, 5), exT('Bench press', 3, 6, 8, 2.5), exT('Seated cable row', 3, 8, 10, 2.5), exT('Lateral raise', 2, 12, 15, 1), exT('Hanging knee raise', 2, 10, 15, 0)] },
  { id: 'B', name: 'Workout B', exercises: [exT('Romanian deadlift', 3, 8, 10, 5), exT('Overhead press', 3, 6, 8, 2.5), exT('Lat pulldown', 3, 8, 10, 2.5), exT('Leg press', 2, 10, 12, 5), exT('Dumbbell curl', 2, 10, 12, 1), exT('Triceps pushdown', 2, 10, 12, 2.5)] },
];
const G = () => S.gym;
const e1rm = (w, r) => w * (1 + r / 30);
const fmtKg = w => `${Math.round(w * 100) / 100} kg`;
function lastPerf(name, beforeId) {
  const ss = [...G().sessions].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  for (const s of ss) { if (s.id === beforeId) continue; const e = s.exercises.find(x => x.name.toLowerCase() === name.toLowerCase()); if (e && e.sets.length) return { date: s.date, sets: e.sets }; }
  return null;
}
function suggest(t) {
  const last = lastPerf(t.name);
  if (!last) return { w: '', note: 'First time: pick a weight you could lift for 2–3 more reps than the target' };
  const top = Math.max(...last.sets.map(s => s.w || 0));
  const topSets = last.sets.filter(s => (s.w || 0) === top);
  const hit = t.hi && topSets.length >= t.sets && topSets.every(s => s.r >= t.hi);
  if (hit && t.inc) return { w: top + t.inc, note: `+${t.inc} kg: you hit ${t.hi} reps on every set last time` };
  return { w: top || '', note: top ? `Same weight as ${fmtDate(last.date).toLowerCase()}: aim for ${t.hi || 'more'} reps` : `Last time: ${last.sets.map(s => s.r).join(', ')} reps` };
}
function nextTemplate() {
  const ts = G().templates; if (!ts.length) return null;
  const last = [...G().sessions].filter(s => s.tid).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id))[0];
  const i = last ? ts.findIndex(t => t.id === last.tid) : -1;
  return ts[(i + 1) % ts.length];
}
function startWorkout(tid, date) {
  const t = G().templates.find(x => x.id === tid);
  G().active = {
    id: uid(), date: date || today(), past: !!(date && date !== today()), started: new Date().toISOString(), tid: t ? t.id : null, name: t ? t.name : 'Workout',
    exercises: t ? t.exercises.map(e => { const sg = suggest(e); return { ...e, note: sg.note, sets: Array.from({ length: e.sets }, () => ({ w: sg.w, r: '', done: false })) }; }) : [],
  };
  save(); ui.lifeSeg = 'gym'; go('life');
}
function finishWorkout() {
  const a = G().active;
  const exs = a.exercises.map(e => ({ name: e.name, sets: e.sets.filter(s => Number(s.r) > 0).map(s => ({ w: Number(s.w) || 0, r: Number(s.r) })) })).filter(e => e.sets.length);
  if (!exs.length) { if (confirm('No sets logged. Discard this workout?')) { G().active = null; save(); render(); } return; }
  let prs = 0;
  for (const e of exs) {
    const best = Math.max(...e.sets.map(s => e1rm(s.w, s.r)));
    const prev = G().sessions.flatMap(s => s.exercises.filter(x => x.name.toLowerCase() === e.name.toLowerCase()).flatMap(x => x.sets)).reduce((m, s) => Math.max(m, e1rm(s.w, s.r)), 0);
    if (prev && best > prev && best > 0) prs++;
  }
  G().sessions.push({ id: a.id, date: a.date, tid: a.tid, name: a.name, mins: a.past ? 0 : Math.round((Date.now() - new Date(a.started)) / 60000), exercises: exs });
  G().active = null; save(); render();
  toast(prs ? `Workout saved · ${prs} new best${prs > 1 ? 's' : ''} 💪` : 'Workout saved 💪');
}

function calcTargets() {
  const b = S.settings.body, kg = latestWeight();
  const bmr = 10 * kg + 6.25 * b.height - 5 * b.age + (b.sex === 'male' ? 5 : b.sex === 'female' ? -161 : -78);
  const tdee = bmr * b.activity;
  return { tdee: Math.round(tdee / 50) * 50, kcal: Math.round((tdee + b.surplus) / 50) * 50, p: Math.round(kg * b.protein / 5) * 5 };
}

function avgWeight(endDate, days = 7) {
  const ws = S.body.weights.filter(w => w.date <= endDate && w.date > addDays(endDate, -days));
  return ws.length ? ws.reduce((a, w) => a + w.kg, 0) / ws.length : null;
}
function weightAdvice() {
  const ws = [...S.body.weights].sort((a, b) => a.date.localeCompare(b.date));
  if (ws.length < 4 || diffDays(today(), ws[0].date) < 21) return 'Weigh in a few mornings a week (after the loo, before eating). After about 3 weeks the app compares your averages and suggests whether to eat more or less.';
  const now = avgWeight(today()), then = avgWeight(addDays(today(), -28));
  if (now == null || then == null) return 'Log a few more weigh-ins to see your trend.';
  const perMonth = (now - then) * 28 / Math.min(28, diffDays(today(), ws[0].date));
  if (perMonth < 0.3) return `You're gaining about ${perMonth.toFixed(1)} kg a month, slower than the ~1 kg aim. Try adding about 150 kcal a day.`;
  if (perMonth > 1.6) return `You're gaining about ${perMonth.toFixed(1)} kg a month, a bit fast for lean gains. Try about 150 kcal a day less.`;
  return `You're gaining about ${perMonth.toFixed(1)} kg a month. Right on track for a lean bulk.`;
}

async function runFoodSearch() {
  const q = $('#sheetForm [name=q]').value.trim();
  if (!q) return;
  $('#hits').innerHTML = '<p class="small muted">Searching…</p>';
  const fields = 'product_name,brands,nutriments,serving_quantity,serving_size';
  const urls = [`https://uk.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&fields=${fields}`,
    `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&fields=${fields}`];
  foodHits = [];
  let failed = 0;
  // The database is often briefly busy (it rate-limits searches), so retry once after a pause.
  for (const u of [...urls, urls[0]]) {
    if (failed === 2) await new Promise(r => setTimeout(r, 2500));
    try {
      const d = await (await fetch(u)).json();
      foodHits = (d.products || []).map(p => ({ name: p.product_name || '', brand: p.brands || '', kcal: Number(p.nutriments && p.nutriments['energy-kcal_100g']), p: Number(p.nutriments && p.nutriments.proteins_100g) || 0, serving: Number(p.serving_quantity) || 0, servingLabel: p.serving_size || '' }))
        .filter(h => h.name && h.kcal >= 0 && !isNaN(h.kcal));
      if (foodHits.length || d.products) break;
    } catch (e) { failed++; }
  }
  if ($('#hits')) $('#hits').innerHTML = foodHits.length ? hitsHtml()
    : failed >= 3 ? '<p class="small muted">The food database (Open Food Facts) is busy right now. Try again in a minute, or use <b>Quick</b>.</p>'
    : '<p class="small muted">Nothing found. Try a simpler word (e.g. "yoghurt" instead of a full product name), or use <b>Quick</b>.</p>';
}

function proteinCombos(gap, kcalLeft) {

  const mine = F().saved.map(x => x.per100 ? { name: `${x.name}, ${x.grams || 100} g`, kcal: x.kcal * (x.grams || 100) / 100, p: x.p * (x.grams || 100) / 100, mine: true, src: x }

    .filter(x => x.p >= 8 && x.p * 4 >= x.kcal * 0.25); // protein-dense: at least a quarter of calories from protein
  // Skip a built-in idea when you've saved your own version of it (e.g. your own whey shake).
  const pool = [...mine, ...PROTEIN_IDEAS.filter(i => !F().saved.some(m => m.name.toLowerCase().includes(i.key)))];
  const combos = [];
  pool.forEach((a, i) => {
    combos.push([a]);
    pool.slice(i).forEach(b => combos.push(a === b ? [a, a] : [a, b]));
  });

    const p = c.reduce((s, x) => s + x.p, 0), k = c.reduce((s, x) => s + x.kcal, 0);
    const short = Math.max(0, gap - p), over = Math.max(0, p - gap - 15);
    const kcalOver = Math.max(0, k - Math.max(kcalLeft, 0) - 150);
    return short * 3 + over + kcalOver / 20 + c.length * 4 - c.filter(x => x.mine).length * 6 + (c.length === 2 && c[0] === c[1] ? 8 : 0);
  };

  return combos.sort((x, y) => score(x) - score(y)).filter(c => { const key = c.map(x => x.name).sort().join('|'); if (seen.has(key)) return false; seen.add(key); return true; }).slice(0, 3)
    .map(c => ({ items: c, p: c.reduce((s, x) => s + x.p, 0), kcal: c.reduce((s, x) => s + x.kcal, 0) }));

    <ul class="list">${shownCombos.map((c, i) => { const names = []; c.items.forEach(x => { const prev = names.find(n => n.x === x); if (prev) prev.n++; else names.push({ x, n: 1 }); });

function reviewWeekDefault() { const t = today(); return parse(t).getDay() === 0 ? weekStart(t) : addDays(weekStart(t), -7); }
function weekStatsFor(ws) {
  const we = addDays(ws, 6), inWk = d => d >= ws && d <= we, end = we < today() ? we : today();
  const days = []; for (let d = ws; d <= end; d = addDays(d, 1)) days.push(d);
  // fitness
  const gym = G().sessions.filter(s => inWk(s.date));
  const other = (G().other || []).filter(o => inWk(o.date));
  const runs = S.runs.filter(r => inWk(r.date));
  const prs = [];
  gym.forEach(s => s.exercises.forEach(e => {
    const best = Math.max(...e.sets.map(x => e1rm(x.w, x.r)));
    const before = G().sessions.filter(o => o.date < ws).flatMap(o => o.exercises.filter(x => x.name === e.name).flatMap(x => x.sets)).reduce((m, x) => Math.max(m, e1rm(x.w, x.r)), 0);
    if (before && best > before && !prs.includes(e.name)) prs.push(e.name);
  }));
  // food
  const t = targets();
  const logged = days.filter(d => d < today() && dayLog(d).length); // today isn't finished yet
  const sums = logged.map(sumDay);
  const avgP = sums.length ? sums.reduce((a, x) => a + x.p, 0) / sums.length : 0;
  const avgK = sums.length ? sums.reduce((a, x) => a + x.kcal, 0) / sums.length : 0;
  const pDays = sums.filter(x => x.p >= t.p * 0.95).length;
  const wNow = avgWeight(end, 7), wPrev = avgWeight(addDays(ws, -1), 7);
  // money
  const spent = S.expenses.filter(e => inWk(e.date));
  const total = spent.reduce((a, e) => a + e.amount, 0);
  const cats = {}; spent.forEach(e => cats[e.cat] = (cats[e.cat] || 0) + e.amount);
  const topCat = Object.entries(cats).sort((a, b) => b[1] - a[1])[0];
  const prev4 = [1, 2, 3, 4].map(k => S.expenses.filter(e => e.date >= addDays(ws, -7 * k) && e.date <= addDays(ws, -7 * k + 6)).reduce((a, e) => a + e.amount, 0));
  const usual = prev4.filter(x => x > 0).length ? prev4.reduce((a, x) => a + x, 0) / prev4.filter(x => x > 0).length : 0;
  // study
  const ticks = Object.values(S.cstate.done).filter(v => typeof v === 'string' && inWk(v)).length;
  const ses = PLOTINUS.sessions.find(x => inWk(x.date));
  const asgDueWk = C() ? C().assignments.filter(a => inWk(asgDue(a))) : [];
  // piano, work, tasks
  const plog = S.pieces.flatMap(p => p.log.filter(l => inWk(l.date)).map(l => ({ ...l, p })));

}
function reviewSuggestions(st) {

  if (C()) {
    const fw = focusWeek();
    if (fw && calWeek() > fw.n) out.push(`Finish course week ${fw.n} (${fw.title}) or push the plan back`);

    <label class="f"><span>Aisle</span>${aisleSelect('aisle2', p.aisle)}</label>
    <label class="f"><span>Use-by date (optional)</span><input name="exp" type="date" value="${p.exp || ''}"></label>`,
    f => { Object.assign(p, { name: f.name.trim(), aisle: f.aisle2, exp: f.exp || '' }); },
    { del: () => { S.pantry = S.pantry.filter(x => x !== p); } });
}

function finishTripForm() {
  const done = S.grocery.filter(g => g.done);
  const newOnes = done.filter(g => !S.pantry.some(p => p.name.toLowerCase() === g.name.toLowerCase()));
  openSheet('Finish shopping trip', `
    <p class="muted small" style="margin-top:-6px">${done.length} item${done.length === 1 ? '' : 's'} checked off. Unchecked items stay on the list.</p>
    <div class="f2">
      <label class="f"><span>Total spent</span><input name="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Optional" autofocus></label>
      <label class="f"><span>Store</span><input name="store" placeholder="e.g. Trader Joe's"></label>
    </div>
    ${newOnes.length ? `<label class="chk"><input type="checkbox" name="toPantry"> Also add ${newOnes.length} new item${newOnes.length === 1 ? '' : 's'} to pantry</label>` : ''}`,
    f => {
      const amt = parseFloat(f.amount);
      if (amt > 0) S.expenses.push({ id: uid(), date: today(), amount: amt, cat: S.settings.categories.includes('Groceries') ? 'Groceries' : S.settings.categories[0], note: f.store.trim() || 'Groceries' });
      for (const g of done) {
        const p = S.pantry.find(x => x.name.toLowerCase() === g.name.toLowerCase());
        if (p) p.status = 'ok';
        else if (f.toPantry) S.pantry.push({ id: uid(), name: g.name, aisle: g.aisle, status: 'ok', exp: '' });
      }
      S.grocery = S.grocery.filter(g => !g.done);
      toast(amt > 0 ? `Trip logged · ${money2(amt)}` : 'List cleared, pantry restocked');
    }, { ok: 'Done' });
}

function taskForm(x) {
  const isNew = !x;
  x = x || { title: '', due: '', time: '', notes: '' };
  const calOn = S.settings.taskCal !== false;
  openSheet(isNew ? 'New to-do' : 'Edit to-do', `
    <label class="f"><span>To-do</span><input name="title" value="${esc(x.title)}" required ${isNew ? 'autofocus' : ''}></label>
    <div class="f2">
      <label class="f"><span>Due date (optional)</span><input name="due" type="date" value="${x.due || ''}"></label>
      <label class="f"><span>Time (optional)</span><input name="time" type="time" value="${x.time || ''}"></label>
    </div>
    <div class="row" style="gap:6px;margin:-6px 0 12px;flex-wrap:wrap">
      <button type="button" class="pill" data-a="setdue" data-v="0">Today</button>
      <button type="button" class="pill" data-a="setdue" data-v="1">Tomorrow</button>
      <button type="button" class="pill" data-a="setdue" data-v="7">Next week</button>
      <button type="button" class="pill" data-a="setdue" data-v="">No date</button>
    </div>
    <label class="chk"><input type="checkbox" name="toCal" ${calOn ? 'checked' : ''}> Add to Calendar with a reminder${x.due && S.cal[taskEvent(x).key] ? ' (already added)' : ''}</label>
    <p class="small muted" style="margin:-6px 0 12px">With a time, the reminder goes off at that time; without one, at 9:00 on the day.</p>
    <label class="f"><span>Notes</span><textarea name="notes">${esc(x.notes || '')}</textarea></label>`,
    f => {
      const data = { title: f.title.trim(), due: f.due, time: f.due ? f.time : '', notes: f.notes.trim() };
      if (isNew) { x = { id: uid(), done: false, ...data }; S.tasks.push(x); } else Object.assign(x, data);
      S.settings.taskCal = !!f.toCal;
      // Open iOS's "Add to Calendar" sheet once the form has saved and closed, unless this exact event was already sent.
      if (f.toCal && x.due && !S.cal[taskEvent(x).key]) setTimeout(() => addToCalendar([taskEvent(x)], 'To-do'), 60);
    }, { del: isNew ? null : () => { S.tasks = S.tasks.filter(t => t !== x); } });
}

function choreForm(c) {
  const isNew = !c;
  c = c || { title: '', every: 7, last: '' };
  openSheet(isNew ? 'New recurring chore' : 'Edit chore', `
    <label class="f"><span>Chore</span><input name="title" value="${esc(c.title)}" required placeholder="Laundry, clean bathroom, haircut…" ${isNew ? 'autofocus' : ''}></label>
    <label class="f"><span>Repeat every (days)</span><input name="every" type="number" inputmode="numeric" min="1" value="${c.every}" required></label>
    <div class="row" style="gap:6px;margin:-6px 0 12px;flex-wrap:wrap">
      ${[[1, 'Daily'], [3, '3 days'], [7, 'Weekly'], [14, '2 weeks'], [30, 'Monthly'], [90, '3 months']].map(([v, l]) => `<button type="button" class="pill" data-a="setevery" data-v="${v}">${l}</button>`).join('')}
    </div>
    <label class="f"><span>Last done (leave empty if it's due now)</span><input name="last" type="date" value="${c.last || ''}"></label>`,
    f => {
      const data = { title: f.title.trim(), every: Math.max(1, parseInt(f.every) || 7), last: f.last };
      if (isNew) S.chores.push({ id: uid(), ...data }); else Object.assign(c, data);
    }, { del: isNew ? null : () => { S.chores = S.chores.filter(x => x !== c); } });
}

function settingsForm() {
  const st = S.settings;
  openSheet('Settings', `
    <label class="f"><span>Your name</span><input name="name" value="${esc(st.name)}" placeholder="For the greeting"></label>
    <div class="f2">
      <label class="f"><span>Distance unit</span><select name="unit"><option value="mi" ${st.unit === 'mi' ? 'selected' : ''}>Miles</option><option value="km" ${st.unit === 'km' ? 'selected' : ''}>Kilometers</option></select></label>
      <label class="f"><span>Currency symbol</span><input name="currency" value="${esc(st.currency)}" maxlength="3"></label>
    </div>
    <label class="f"><span>Spending categories (one per line)</span><textarea name="cats" rows="6">${esc(st.categories.join('\n'))}</textarea></label>
    <div class="card" style="margin:4px 0 14px">
      <h2>Backup</h2>
      <p class="small muted" style="margin:0 0 10px">Your data lives only on this phone. Export a backup now and then (saves to Files). Restore it here if you ever lose it.</p>
      <div class="row"><button type="button" class="btn sec sm grow" data-a="export">Export backup</button>
      <label class="btn sec sm grow" style="text-align:center;display:grid;place-items:center">Restore backup<input type="file" data-a="import" hidden></label></div>
    </div>
    <button type="button" class="btn danger block" data-a="reset" style="margin-bottom:12px">Erase all data</button>`,
    f => {
      const cats = f.cats.split('\n').map(s => s.trim()).filter(Boolean);
      Object.assign(st, { name: f.name.trim(), unit: f.unit, currency: f.currency.trim() || '$', categories: cats.length ? cats : DEFAULTS().settings.categories });
    });
}

// ---------- actions ----------
const byId = (arr, id) => arr.find(x => x.id === id);
const ACTIONS = {
  goto: el => go(el.dataset.v, el.dataset.s ? { study: 'studySeg', life: 'lifeSeg', food: 'foodSeg', money: 'moneySeg' }[el.dataset.v] : null, el.dataset.s),
  seg: el => { ui[el.dataset.k] = el.dataset.v; render(); },
  settings: settingsForm,
  addExpense: () => expenseForm(),
  editExpense: el => expenseForm(byId(S.expenses, el.dataset.id)),
  month: el => { const [y, m] = ui.month.split('-').map(Number); const d = new Date(y, m - 1 + Number(el.dataset.v), 1); ui.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); },
  addBill: () => billForm(),
  editBill: el => billForm(byId(S.bills, el.dataset.id)),
  paybill: el => { payBill(byId(S.bills, el.dataset.id)); save(); render(); },
  addRun: () => runForm(),
  editRun: el => runForm(byId(S.runs, el.dataset.id)),
  quickGrocery: () => { ui.foodSeg = 'list'; go('food'); setTimeout(() => $('[data-form=grocery] input').focus(), 50); },
  gcheck: el => { const g = byId(S.grocery, el.dataset.id); g.done = !g.done; save(); render(); },
  editGrocery: el => groceryForm(byId(S.grocery, el.dataset.id)),
  finishTrip: finishTripForm,
  pstatus: el => {
    const p = byId(S.pantry, el.dataset.id);
    p.status = { ok: 'low', low: 'out', out: 'ok' }[p.status];
    if (p.status !== 'ok' && !S.grocery.some(g => g.name.toLowerCase() === p.name.toLowerCase())) {
      S.grocery.push({ id: uid(), name: p.name, aisle: p.aisle, qty: '', done: false });
      toast(`${p.name} added to grocery list`);
    }
    save(); render();
  },
  editPantry: el => pantryForm(byId(S.pantry, el.dataset.id)),
  addTask: () => taskForm(),
  editTask: el => taskForm(byId(S.tasks, el.dataset.id)),
  task: el => { const x = byId(S.tasks, el.dataset.id); x.done = !x.done; x.doneAt = x.done ? new Date().toISOString() : ''; save(); render(); if (x.done) toast('Done ✓'); },
  toggleDone: () => { ui.showDone = !ui.showDone; render(); },
  clearDone: () => { if (confirm('Delete all completed to-dos?')) { S.tasks = S.tasks.filter(x => !x.done); save(); render(); } },
  addChore: () => choreForm(),
  editChore: el => choreForm(byId(S.chores, el.dataset.id)),
  chore: el => { const c = byId(S.chores, el.dataset.id); c.last = today(); save(); render(); toast(`${c.title} · next ${fmtDate(choreDue(c)).toLowerCase()}`); },
  setdue: el => { $('#sheetForm [name=due]').value = el.dataset.v === '' ? '' : addDays(today(), Number(el.dataset.v)); },
  setevery: el => { $('#sheetForm [name=every]').value = el.dataset.v; },
  addShift: () => shiftForm(),
  editShift: el => shiftForm(byId(S.shifts, el.dataset.id)),
  pasteShifts: pasteShiftsForm,
  togglePast: () => { ui.showPast = !ui.showPast; render(); },
  addPiece: () => pieceForm(),
  editPiece: el => pieceForm(byId(S.pieces, el.dataset.id)),
  logPractice: el => practiceForm(el.dataset.id),
  setTarget: el => { const st = $('#sheetForm [name=start]').value || today(); $('#sheetForm [name=target]').value = addDays(st, 7 * Number(el.dataset.v)); },
  setMins: el => { $('#sheetForm [name=mins]').value = el.dataset.v; },
  readCh: el => { const d = el.dataset.d; S.study.read[d] = !S.study.read[d]; save(); render(); if (S.study.read[d]) toast('Chapter read ✓'); },
  chair: el => { const d = el.dataset.d; S.study.chair[d] = !S.study.chair[d]; save(); render(); },
  bgRead: el => { const i = el.dataset.i; S.study.bg[i] = !S.study.bg[i]; save(); render(); },
  openIdea: el => ideaForm(S.ideas.find(i => i.key === el.dataset.id)),
  citem: el => { const w = C().weeks.find(x => x.n === Number(el.dataset.w)); const it = w.items[Number(el.dataset.i)]; const k = itemKey(w, it); S.cstate.done[k] = S.cstate.done[k] ? false : today(); save(); render(); if (S.cstate.done[k] && weekDone(w)) toast(`Week ${w.n} done ✓`); },
  shiftPlan: el => { S.cstate.offset = Math.max(0, (S.cstate.offset || 0) + Number(el.dataset.v)); save(); render(); toast(Number(el.dataset.v) > 0 ? 'Plan pushed back a week' : 'Shift undone'); },
  haveBook: el => { S.cstate.have[el.dataset.t] = 'yes'; save(); render(); },
  openAsg: el => asgForm(C().assignments.find(a => a.n === Number(el.dataset.n))),
  calShifts: () => addToCalendar(newOrAll(upcomingShifts().map(shiftEvent)).list, 'Shifts'),
  calShift: el => { addToCalendar([shiftEvent(byId(S.shifts, el.dataset.id))], 'Shift'); closeSheet(); },
  calPlotinus: () => addToCalendar(newOrAll(PLOTINUS.sessions.filter(s => s.date >= today()).map(sessionEvent)).list, 'Plotinus reading group'),
  calAsgs: () => addToCalendar(newOrAll(openAsgEvents()).list, 'Assignment due dates'),
  calAsg: el => { addToCalendar([asgEvent(C().assignments.find(a => a.n === Number(el.dataset.n)))], 'Assignment'); closeSheet(); },
  calTasks: () => addToCalendar(newOrAll(S.tasks.filter(x => !x.done && x.due && x.due >= today()).map(taskEvent)).list, 'To-dos'),
  calBills: () => addToCalendar(newOrAll(S.bills.map(billEvent)).list, 'Bills'),
  calBill: el => { addToCalendar([billEvent(byId(S.bills, el.dataset.id))], 'Bill'); closeSheet(); },
  quickFood: () => { ui.foodSeg = 'eat'; ui.foodDay = today(); go('food'); foodAddSheet('saved'); },
  quickGym: () => { ui.lifeSeg = 'gym'; go('life'); },
  startWorkout: el => { if (G().active && !confirm('A workout is already in progress. Replace it?')) return; startWorkout(el.dataset.t); },
  finishWorkout: finishWorkout,
  discardWorkout: () => { if (confirm('Discard this workout?')) { G().active = null; save(); render(); } },
  setDone: el => { const e = G().active.exercises[el.dataset.e], st = e.sets[el.dataset.s]; st.done = !st.done; if (st.done && st.r === '') st.r = e.hi || ''; save(); render(); },
  addSet: el => { const e = G().active.exercises[el.dataset.e]; const last = e.sets[e.sets.length - 1]; e.sets.push({ w: last ? last.w : '', r: '', done: false }); save(); render(); },
  rmExercise: el => { G().active.exercises.splice(Number(el.dataset.e), 1); save(); render(); },
  exHistory: el => exHistoryForm(el.dataset.n),
  openSession: el => sessionForm(G().sessions.find(s => s.id === el.dataset.id)),
  editTemplates: templatesForm,
  pastWorkout: pastWorkoutForm,
  addOther: () => otherForm(),
  editOther: el => otherForm(G().other.find(o => o.id === el.dataset.id)),
  setOtherType: el => { $('#sheetForm [name=type]').value = el.dataset.v; $('#sheetForm [name=unit]').value = /swim|row/i.test(el.dataset.v) ? 'm' : 'km'; },
  resetPlan: () => { if (confirm('Replace your workouts with the beginner plan (A and B)?')) { G().templates = BEGINNER(); save(); closeSheet(); render(); toast('Beginner plan restored'); } },
  foodAdd: el => foodAddSheet(el.dataset.v, ($('#sheetForm [name=q]') || {}).value || ''),
  foodSearch: () => runFoodSearch(),
  pickSaved: el => { const x = F().saved.find(s => s.id === el.dataset.id); amountSheet({ name: x.name, kcal: x.kcal, p: x.p, per100: x.per100, grams: x.grams, serving: x.serving, savedId: x.id }); },
  pickHit: el => { const h = foodHits[Number(el.dataset.i)]; amountSheet({ name: h.brand ? `${h.name} (${h.brand.split(',')[0]})` : h.name, kcal: h.kcal, p: h.p, per100: true, grams: h.serving || 100, fromSearch: true }); },
  editSaved: el => savedForm(el.dataset.id ? F().saved.find(s => s.id === el.dataset.id) : null),
  editEntry: el => entryForm(F().log.find(x => x.id === el.dataset.id)),
  foodDay: el => { ui.foodDay = addDays(ui.foodDay || today(), Number(el.dataset.v)); if (ui.foodDay > today()) ui.foodDay = today(); render(); },
  copyDay: () => { const d = ui.foodDay || today(); dayLog(addDays(d, -1)).forEach(x => F().log.push({ ...x, id: uid(), date: d })); save(); render(); toast("Copied yesterday's food"); },
  saveMeal: el => {
    const d = ui.foodDay || today(), m = el.dataset.m, xs = dayLog(d).filter(x => x.meal === m);
    openSheet('Save as a meal', `<label class="f"><span>Name</span><input name="name" value="${esc(m)}" required autofocus></label><p class="small muted">${xs.map(x => esc(x.name)).join(', ')}: ${r0(xs.reduce((a, x) => a + x.kcal, 0))} kcal, ${r0(xs.reduce((a, x) => a + x.p, 0))} g protein. Next time it's one tap under Saved.</p>`,
      f => { F().saved.push({ id: uid(), kind: 'meal', name: f.name.trim(), kcal: xs.reduce((a, x) => a + x.kcal, 0), p: xs.reduce((a, x) => a + x.p, 0), serving: xs.map(x => x.name).join(' + '), used: 1 }); toast('Meal saved'); });
  },
  logWeight: weightForm,
  editTargets: targetsForm,
  openReview: el => { ui.reviewWs = el.dataset.v || reviewWeekDefault(); go('review'); },
  reviewWeek: el => { ui.reviewWs = addDays(ui.reviewWs || reviewWeekDefault(), Number(el.dataset.v)); render(); window.scrollTo(0, 0); },
  saveFocus: el => {
    const fm = $('#focusForm'); const picked = [...fm.querySelectorAll('[name=f]:checked')].map(x => x.value);
    const custom = fm.custom.value.trim(); if (custom) picked.push(custom);
    if (!S.focus) S.focus = {};
    S.focus[el.dataset.w] = picked; save(); render(); toast(picked.length ? 'Focus set for next week 🎯' : 'Focus cleared');
  },
  addCombo: el => { const c = shownCombos[Number(el.dataset.i)]; const meal = defaultMeal(); c.items.forEach(x => { logFood({ name: x.name, kcal: x.kcal, p: x.p, meal, qty: x.src && x.src.per100 ? `${x.src.grams || 100} g` : '' }); if (x.src) x.src.used = (x.src.used || 0) + 1; }); save(); render(); toast(`Added +${r0(c.p)} g protein`); },
  closeSheet: closeSheet,
  sheetDel: () => { if (sheetDel && confirm('Delete this?')) { sheetDel(); save(); closeSheet(); render(); } },
  export: async () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const name = `life-admin-backup-${today()}.json`;
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  reset: () => {
    if (confirm('Erase everything in this app? Export a backup first if you might want it back.') && confirm('Really erase all data?')) {
      S = DEFAULTS(); save(); closeSheet(); go('today'); toast('All data erased');
    }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT') return;
  const fn = ACTIONS[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.a === 'importIdeas' && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try { const msg = importIdeas(JSON.parse(r.result)); save(); render(); toast(msg); }
      catch (err) { toast("That isn't a file from Sync Obsidian"); }
    };
    r.readAsText(e.target.files[0]);
    return;
  }
  if (e.target.dataset.a !== 'import' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !d.settings || !Array.isArray(d.expenses)) throw new Error('bad');
      if (!confirm('Replace everything in the app with this backup?')) return;
      S = merge(d);
      save(); closeSheet(); render(); toast('Backup restored');
    } catch (err) { toast("That file isn't a Life Admin backup"); }
  };
  r.readAsText(e.target.files[0]);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.g2 === 'date' && G().active && t.value) { G().active.date = t.value; G().active.past = t.value !== today(); save(); }
  if (t.dataset.g && G().active) { const st = G().active.exercises[t.dataset.e].sets[t.dataset.s]; st[t.dataset.g] = t.value; save(); }
  if (t.dataset.a2 === 'filter') { const q = t.value.toLowerCase(); document.querySelectorAll('#savedList li').forEach(li => li.style.display = li.dataset.name.includes(q) ? '' : 'none'); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.a2 === 'meal') ui.meal = e.target.value;
  if (e.target.dataset.g2 === 'date' && G().active && e.target.value) { G().active.date = e.target.value; G().active.past = e.target.value !== today(); save(); render(); }
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });

// inline add forms
document.addEventListener('submit', e => {
  const kind = e.target.dataset.form;
  if (!kind) return;
  e.preventDefault();
  const input = e.target.querySelector('input');
  const val = input.value.trim();
  if (!val) return;
  if (kind === 'addex') {
    const sg = suggest({ name: val, sets: 3, hi: 0, inc: 0 });
    G().active.exercises.push({ name: val, sets: [0, 1, 2].map(() => ({ w: sg.w, r: '', done: false })), lo: '', hi: '', inc: 0, note: lastPerf(val) ? sg.note : '' });
    save(); render(); return;
  }
  if (kind === 'grocery') {
    if (S.grocery.some(g => g.name.toLowerCase() === val.toLowerCase() && !g.done)) { toast('Already on the list'); input.value = ''; return; }
    S.grocery.push({ id: uid(), name: val, aisle: guessAisle(val), qty: '', done: false });
  } else if (kind === 'pantry') {
    S.pantry.push({ id: uid(), name: val, aisle: guessAisle(val), status: 'ok', exp: '' });
  } else if (kind === 'task') {
    S.tasks.push({ id: uid(), title: val, due: '', notes: '', done: false });
  }
  save(); render();
  const again = $(`[data-form=${kind}] input`); if (again) again.focus();
});

// bill/sub segmented radio styling
const segStyle = document.createElement('style');
segStyle.textContent = `.segl{display:block;text-align:center;padding:8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)} input:checked+.segl{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}`;
document.head.appendChild(segStyle);

// refresh "today" when reopened on a new day
let lastDay = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && today() !== lastDay) { lastDay = today(); ui.month = monthKey(lastDay); runAutopay(); render(); }
});

runAutopay();
render();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
